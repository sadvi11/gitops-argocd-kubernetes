name: GitOps verification

# Two levels of proof:
#   validate       - every push and PR. Manifests build and are schema-valid.
#   gitops-verify  - main only. Stands up a real cluster, installs Argo CD,
#                    syncs from this repo, then deliberately breaks the cluster
#                    and asserts Argo CD puts it back.
#
# The second job is the point. Anyone can lint YAML; the claim worth proving is
# that drift actually self-heals.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  ARGOCD_VERSION: v2.13.2

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize and kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform

      - name: Build every overlay and schema-validate the output
        run: |
          fail=0
          for overlay in workloads/*/overlays/*; do
            echo "::group::$overlay"
            if ! kustomize build "$overlay" > /tmp/out.yaml; then
              echo "::error::kustomize build failed for $overlay"; fail=1; echo "::endgroup::"; continue
            fi
            # -strict rejects unknown fields, which is how typos in a manifest
            # silently become no-ops instead of errors.
            if ! kubeconform -strict -summary -ignore-missing-schemas /tmp/out.yaml; then
              echo "::error::kubeconform failed for $overlay"; fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Assert security invariants hold in the rendered output
        run: |
          # These are the properties that must survive any future overlay edit.
          # Asserting on rendered output catches a patch that quietly drops them.
          fail=0
          for overlay in workloads/*/overlays/*; do
            out=$(kustomize build "$overlay")
            for want in "runAsNonRoot: true" "allowPrivilegeEscalation: false" "readOnlyRootFilesystem: true"; do
              if ! grep -q "$want" <<<"$out"; then
                echo "::error::$overlay is missing '$want'"; fail=1
              fi
            done
            if grep -qE 'image: .*:latest' <<<"$out"; then
              echo "::error::$overlay uses a :latest tag - the cluster and git can then disagree"; fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "All overlays keep the hardened defaults."
          exit $fail

  gitops-verify:
    name: Prove drift self-heals
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Create a 3-node kind cluster
        uses: helm/kind-action@v1
        with:
          config: kind/cluster.yaml
          cluster_name: gitops

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd -f \
            "https://raw.githubusercontent.com/argoproj/argo-cd/${ARGOCD_VERSION}/manifests/install.yaml"
          # Reconcile fast so the drift test does not wait on the 3m default.
          kubectl -n argocd patch configmap argocd-cm --type merge \
            -p '{"data":{"timeout.reconciliation":"15s"}}'
          kubectl -n argocd rollout restart deploy/argocd-repo-server statefulset/argocd-application-controller
          for d in argocd-repo-server argocd-server argocd-redis argocd-dex-server; do
            kubectl -n argocd rollout status "deploy/$d" --timeout=300s
          done
          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=300s

      - name: Bootstrap - apply ONLY the root app
        run: |
          # This is the whole bootstrap. Everything else arrives from git.
          kubectl apply -f apps/root-app.yaml
          kubectl -n argocd wait --for=jsonpath='{.status.sync.status}'=Synced \
            application/root --timeout=300s

      - name: Wait for child apps to be Synced and Healthy
        run: |
          for app in podinfo-dev podinfo-prod; do
            echo "waiting for $app"
            kubectl -n argocd wait --for=jsonpath='{.status.sync.status}'=Synced \
              "application/$app" --timeout=420s
            kubectl -n argocd wait --for=jsonpath='{.status.health.status}'=Healthy \
              "application/$app" --timeout=420s
          done
          kubectl get applications -n argocd

      - name: Confirm the declared state actually landed
        run: |
          kubectl -n podinfo-dev  rollout status deploy/podinfo --timeout=180s
          kubectl -n podinfo-prod rollout status deploy/podinfo --timeout=180s
          dev=$(kubectl -n podinfo-dev  get deploy podinfo -o jsonpath='{.spec.replicas}')
          prod=$(kubectl -n podinfo-prod get deploy podinfo -o jsonpath='{.spec.replicas}')
          echo "dev=$dev prod=$prod"
          [ "$dev" = "1" ]  || { echo "::error::dev should be 1, got $dev"; exit 1; }
          [ "$prod" = "3" ] || { echo "::error::prod should be 3, got $prod"; exit 1; }
          # The PDB is prod-only; its absence in dev proves the overlays diverge.
          kubectl -n podinfo-prod get pdb podinfo
          if kubectl -n podinfo-dev get pdb podinfo 2>/dev/null; then
            echo "::error::dev should not have a PDB"; exit 1
          fi

      - name: DRIFT TEST - break the cluster by hand, expect Argo CD to revert it
        run: |
          echo "Scaling prod to 1 replica directly against the cluster (the thing
          you are told never to do). Argo CD should undo it without any push."
          kubectl -n podinfo-prod scale deploy/podinfo --replicas=1
          kubectl -n podinfo-prod get deploy podinfo -o jsonpath='{.spec.replicas}'; echo " <- drifted"

          for i in $(seq 1 60); do
            n=$(kubectl -n podinfo-prod get deploy podinfo -o jsonpath='{.spec.replicas}')
            if [ "$n" = "3" ]; then
              echo "SELF-HEAL CONFIRMED after ~$((i*5))s: replicas back to 3, no human involved."
              exit 0
            fi
            sleep 5
          done
          echo "::error::drift was not reverted within 300s"
          kubectl -n argocd get application podinfo-prod -o yaml | tail -40
          exit 1

      - name: PRUNE TEST - a resource deleted from git is removed from the cluster
        run: |
          # Create something Argo CD does not know about but that carries the
          # app's label, then confirm a sync prunes it.
          kubectl -n podinfo-prod create configmap orphan --from-literal=x=y
          kubectl -n podinfo-prod label configmap orphan \
            app.kubernetes.io/instance=podinfo-prod
          echo "orphan configmap created and labelled as part of the app"
          for i in $(seq 1 48); do
            if ! kubectl -n podinfo-prod get configmap orphan >/dev/null 2>&1; then
              echo "PRUNE CONFIRMED after ~$((i*5))s: resource absent from git was removed."
              exit 0
            fi
            sleep 5
          done
          echo "::error::orphan resource was not pruned within 240s"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### GitOps verification"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Manifests build and schema-validate | see validate job |"
            echo "| Argo CD synced from git alone | ✅ |"
            echo "| dev=1 / prod=3 replicas as declared | ✅ |"
            echo "| PDB present in prod, absent in dev | ✅ |"
            echo "| Manual drift reverted automatically | ✅ |"
            echo "| Resource absent from git pruned | ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"
