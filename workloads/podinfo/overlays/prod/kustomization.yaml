apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: podinfo-prod

resources:
  - ../../base
  - poddisruptionbudget.yaml

# Prod keeps three replicas so a rolling update and a node loss can overlap
# without dropping below the PDB floor.
replicas:
  - name: podinfo
    count: 3
