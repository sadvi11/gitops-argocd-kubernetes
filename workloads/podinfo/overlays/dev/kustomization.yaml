apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: podinfo-dev

resources:
  - ../../base

# Dev runs lean: one replica is enough to prove the deploy works.
replicas:
  - name: podinfo
    count: 1

patches:
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 100m
